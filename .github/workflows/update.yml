name: Update formula

# Regenerates each formula from its project's latest release, then installs every
# formula with Homebrew on macOS and Linux to prove it works.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/**]

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      formulae: ${{ steps.render.outputs.formulae }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: render
        run: |
          result=$(scripts/render.sh)
          printf '%s\n' "$result" | sed 's/^/render: /' | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git status --porcelain Formula)" ]; then
            # Rewritten formulae are the lines that end in a version: "typeshelf 0.2.4".
            message=$(printf '%s\n' "$result" | grep -v -e ' unchanged$' -e ' no release$' | paste -sd, - | sed 's/,/, /g')
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Formula
            git commit -m "$message"
            git push
          fi
          # Every formula in the repository is tested, changed or not.
          echo "formulae=$(ls Formula | sed -n 's/\.rb$//p' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  test:
    needs: update
    if: needs.update.outputs.formulae != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        formula: ${{ fromJSON(needs.update.outputs.formulae) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Put Homebrew on PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - run: brew install anwarahmed/tap/${{ matrix.formula }}
      - run: brew test anwarahmed/tap/${{ matrix.formula }}
      - run: ${{ matrix.formula }} --version
      - name: A Homebrew copy of typeshelf must refuse to update itself
        # Run by its linked name, as a user would. Up to 0.2.2 the self-updater did not see
        # through Homebrew's symlink on macOS, replaced it, and broke the next `brew upgrade`.
        if: matrix.formula == 'typeshelf'
        run: |
          out=$(typeshelf update 2>&1) && status=0 || status=$?
          echo "$out"
          [ "$status" -ne 0 ] && echo "$out" | grep -q "installed with Homebrew"
      - name: A Homebrew copy of wordl must refuse to update itself
        # Run by its linked name, as a user would, from another directory. The formula
        # installs a marker (share/wordl/managed-by) that says Homebrew owns the copy;
        # wordl then leaves updating to brew upgrade.
        if: matrix.formula == 'wordl'
        run: |
          cd /
          out=$(wordl update 2>&1) && status=0 || status=$?
          echo "$out"
          [ "$status" -ne 0 ] && echo "$out" | grep -q "installed with Homebrew"
      - name: A Homebrew copy of funchess must refuse to update itself
        # Run by its linked name, as a user would, from another directory. The formula
        # installs a marker (share/funchess/managed-by) that says Homebrew owns the copy;
        # funchess then leaves updating to brew upgrade.
        if: matrix.formula == 'funchess'
        run: |
          cd /
          out=$(funchess update 2>&1) && status=0 || status=$?
          echo "$out"
          [ "$status" -ne 0 ] && echo "$out" | grep -q "installed with Homebrew"
      - name: A Homebrew copy of fungeo must refuse to update itself
        # Run by its linked name, as a user would, from another directory. The formula
        # installs a marker (share/fungeo/managed-by) that says Homebrew owns the copy;
        # fungeo then leaves updating to brew upgrade.
        if: matrix.formula == 'fungeo'
        run: |
          cd /
          out=$(fungeo update 2>&1) && status=0 || status=$?
          echo "$out"
          [ "$status" -ne 0 ] && echo "$out" | grep -q "installed with Homebrew"
      - name: A Homebrew copy of funwordl must refuse to update itself
        # Run by its linked name, as a user would, from another directory. The formula
        # installs a marker (share/funwordl/managed-by) that says Homebrew owns the copy;
        # funwordl then leaves updating to brew upgrade.
        if: matrix.formula == 'funwordl'
        run: |
          cd /
          out=$(funwordl update 2>&1) && status=0 || status=$?
          echo "$out"
          [ "$status" -ne 0 ] && echo "$out" | grep -q "installed with Homebrew"
